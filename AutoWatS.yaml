    #         new_pulse_total: int
    #     then:
    #       - pulse_counter.set_total_pulses:
    #           id: pulse_counter_id
    #           value: !lambda 'return new_pulse_total;'



# ===== HARDWARE MAPPING & SENSORS =====

external_components:
  - source:
      type: local
      path: components

i2c:
  sda: GPIO33
  scl: GPIO25
  scan: true
  frequency: 10kHz

# spi:
#   - id: spiV
#     clk_pin: GPIO18
#     mosi_pin: GPIO23
#     miso_pin: GPIO19
#     interface: spi2
#   - id: spiH
#     clk_pin: GPIO14
#     mosi_pin: GPIO13
#     miso_pin: GPIO12
#     interface: spi3


# == MCP23017, i2c port expander wired to a relay board ==
mcp23017:
  # NOTE: GPIO pins in the datasheet are labelled A0 to A7 and B0 to B7, these are mapped consecutively in this component to numbers from 0 to 15
  - id: 'relay_hub'
    address: 0x20

# Individual outputs
switch:
  - platform: gpio
    name: "Valve 1"
    pin:
      mcp23xxx: relay_hub
      # Use pin B1
      number: 9
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Valve 2"
    pin:
      mcp23xxx: relay_hub
      # Use pin A1
      number: 1
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Valve 3"
    pin:
      mcp23xxx: relay_hub
      # Use pin B0
      number: 8
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Valve 4"
    pin:
      mcp23xxx: relay_hub
      # Use pin A0
      number: 0
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Mix Bowl Pump"
    id: mix_bowl_pump
    pin:
      mcp23xxx: relay_hub
      # Use pin B4
      number: 12
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Clear Water Tank Pump"
    id: clear_water_pump
    pin:
      mcp23xxx: relay_hub
      # Use pin A4
      number: 4
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Fertilizer Pump 1"
    pin:
      mcp23xxx: relay_hub
      # Use pin A5
      number: 5
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Fertilizer Pump 2"
    pin:
      mcp23xxx: relay_hub
      # Use pin B5
      number: 13
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Fertilizer Pump 3"
    pin:
      mcp23xxx: relay_hub
      # Use pin A6
      number: 6
      mode:
        output: true
      inverted: true

  - platform: gpio
    id: pulse_counter_power
    name: "Pulse Counters Power"
    pin: GPIO32

sensor:
  - platform: uptime
    name: "ESP System Uptime"

  - platform: wifi_signal
    name: "ESP WiFi Signal"
    update_interval: 5s

  - platform: pulse_counter
    pin: GPIO35
    update_interval: 30s
    id: ha_tank_flow_counter
    # unit_of_measurement: 'L / min'
    # name: 'Water Tank Flow Rate'
    # filters:
    #   - multiply: 0.0016  # FIXME
    total:
      unit_of_measurement: 'mL'
      name: 'Water Tank Flow Count'
      filters:
        - multiply: 1.6  # 1.6 mL / pulse

  - platform: pulse_counter
    pin: GPIO34
    update_interval: 30s
    id: ha_bowl_flow_counter
    # unit_of_measurement: 'L / min'
    # name: 'Mixer Bowl Flow Rate'
    # filters:
    #   - multiply: 0.018  # FIXME 0.3 mL / pulse
    total:
      unit_of_measurement: 'mL'
      name: 'Mixer Bowl Flow Count'
      filters:
        - multiply: 0.3  # 0.3 mL per pulse

  # Signal on GPIO 34 / 35 is duplicated on GPIO 16 & 17
  # This is used for fast-rate internal counters (used as stop condition for pumps)
  - platform: pulse_counter
    pin: GPIO17
    id: local_tank_flow_counter
    internal: true
    update_interval: 100ms
    total:
      id: local_tank_volume
      filters:
        - multiply: 1.6  # 1.6 mL / pulse
      internal: true

  - platform: pulse_counter
    pin: GPIO16
    id: local_bowl_flow_counter
    internal: true
    update_interval: 100ms
    total:
      id: local_bowl_volume
      filters:
        - multiply: 0.3  # 0.3 mL per pulse
      internal: true

  # == i2c_scale is an AVR (arduino nano) wired to an HX711 ==
  - platform: i2c_scale
    name: "Scale"
    address: 0x23
    update_interval: 60s

    # always_on: false

    read_samples: 5
    maintenance_samples: 20

    tare:
      name: "Scale Tare"

    calibration:
      name: "Scale Calibration"
      min_value: 0.1
      max_value: 100000
      step: 0.1
      restore_value: true

binary_sensor:
  - platform: status
    name: "ESP System Status"


# ===== AUTOMATION & SCRIPTING =====

number:
  - platform: template
    name: "Water Target Volume (L)"
    id: water_target
    min_value: 0
    max_value: 10
    step: 0.05
    optimistic: true

globals:
  # flag to indicate a pump is currently running
  - id: pump_running
    type: bool
    restore_value: no
    initial_value: 'false'

button:
  - platform: template
    name: "Start Water Dose"
    on_press:
      - pulse_counter.set_total_pulses:
          id: local_tank_flow_counter
          value: 0

      - delay: 150ms

      - lambda: |-
          id(pump_running) = true;
      - switch.turn_on: pulse_counter_power
      - switch.turn_on: clear_water_pump

interval:
  # ===== Check each iterval that the Tank Water dose has been delivered
  #       If volume water_target has been reached, turn of pump and sensor =====
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: |-
              return id(pump_running) &&
                     id(local_tank_volume).state >= id(water_target).state * 1000;
          then:
            - switch.turn_off: clear_water_pump
            - switch.turn_off: pulse_counter_power
            - lambda: |-
                id(pump_running) = false;

  # ===== DEBUG =====
  - interval: 1s
    then:
      - logger.log:
          format: "target=%f pulses=%f active=%d"
          args:
            - id(water_target).state * 1000
            - id(local_tank_volume).state
            - id(pump_running)



