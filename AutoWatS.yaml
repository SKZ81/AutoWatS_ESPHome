esphome:
  name: autowats-esp

esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Autowtas Fallback Hotspot"
    password: !secret hotspot_password

captive_portal:

# Enable logging
logger:
  level: DEBUG
  logs:
    pulse_counter: INFO
    # local_bowl_flow_counter: INFO
    # local_tank_flow_counter: INFO


ota:
  - platform: esphome
    password: !secret autowats_ota_passaword

api:
  encryption:
    key: !secret autowats_api_key
